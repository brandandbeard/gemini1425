<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="orb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />

  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#06b6d4" stroke-width="4" stroke-opacity="0.3" filter="url(#glow)" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#6366f1" stroke-width="4" stroke-opacity="0.4" />

  <!-- Center Glowing Orb -->
  <circle cx="256" cy="256" r="110" fill="url(#orb)" filter="url(#glow)" />

  <!-- Sound wave bars inside core -->
  <g fill="#ffffff" opacity="0.95">
    <rect x="180" y="226" width="12" height="60" rx="6" />
    <rect x="204" y="206" width="12" height="100" rx="6" />
    <rect x="228" y="186" width="12" height="140" rx="6" />
    <rect x="252" y="166" width="12" height="180" rx="6" />
    <rect x="276" y="186" width="12" height="140" rx="6" />
    <rect x="300" y="206" width="12" height="100" rx="6" />
    <rect x="324" y="226" width="12" height="60" rx="6" />
  </g>
</svg>
